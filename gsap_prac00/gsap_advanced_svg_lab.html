<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP Advanced SVG Animation Laboratory</title>
  
  <!-- GSAP Engine & Plugins -->
  <script src="gsap/dist/gsap.min.js"></script>
  <script src="gsap/dist/ScrollTrigger.min.js"></script>
  <script src="gsap/dist/Draggable.min.js"></script>
  <script src="gsap/dist/TextPlugin.min.js"></script>
  <script src="gsap/dist/EasePack.min.js"></script>
  <script src="gsap/dist/MotionPathPlugin.min.js"></script>
  <script src="gsap/dist/Flip.min.js"></script>
  <script src="gsap/dist/CustomEase.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Outfit:wght@400;600;800&family=Nunito:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #090d16;
      --bg-panel: rgba(30, 41, 59, 0.4);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      
      --brand: #ea580c;
      --brand-glow: rgba(234, 88, 12, 0.35);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.3);
      --success: #10b981;
      
      --font-ui: 'Outfit', sans-serif;
      --font-mono: 'Fira Code', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text);
      font-family: var(--font-ui);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 30%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .badge-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .badge {
      background: rgba(236, 72, 153, 0.1);
      color: #f472b6;
      border: 1px solid rgba(236, 72, 153, 0.2);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .lab-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 450px 1fr;
      height: calc(100vh - 70px);
      overflow: hidden;
    }

    .left-pane {
      border-right: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.35);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .selector-block {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .selector-block label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    select {
      width: 100%;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 12px;
      font-family: var(--font-ui);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .problem-description {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .problem-description h2 {
      font-size: 1.25rem;
      color: #cbd5e1;
    }

    .problem-description p {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .concepts-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background: rgba(236, 72, 153, 0.1);
      color: #f472b6;
      border: 1px solid rgba(236, 72, 153, 0.2);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .editor-section {
      padding: 20px;
      background: rgba(15, 23, 42, 0.6);
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 350px;
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .editor-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    textarea.code-area {
      width: 100%;
      flex: 1;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #f472b6;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 15px;
      resize: none;
      outline: none;
      line-height: 1.6;
    }

    textarea.code-area:focus {
      border-color: #ec4899;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 10px 16px;
      border-radius: 6px;
      font-family: var(--font-ui);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #ec4899;
      color: white;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.3);
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #334155;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .preview-pane {
      background: #0b0f19;
      display: flex;
      flex-direction: column;
      padding: 30px;
      overflow-y: auto;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .canvas-title {
      position: absolute;
      top: 20px;
      left: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #render-sandbox {
      width: 100%;
      max-width: 800px;
      height: 600px;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--border);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .grid-guide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      z-index: 1;
    }

    #sandbox-content {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #sandbox-content svg {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h1>GSAP Advanced SVG Architecture Lab</h1>
    <div class="badge-bar">
      <div class="badge">Model: agent_work00.svg</div>
      <div class="badge" style="background: rgba(59, 130, 246, 0.1); color: var(--accent); border-color: rgba(59, 130, 246, 0.2);">30 SVG Tasks</div>
    </div>
  </header>

  <div class="lab-grid">
    <div class="left-pane">
      <div class="selector-block">
        <label for="ex-select">Select Challenge (1–30)</label>
        <select id="ex-select" onchange="loadChallenge(this.value)">
          <optgroup label="Tier 1: selection & normalization">
            <option value="ex-0">Ex 01: Programmatic Mapping Setup</option>
            <option value="ex-1">Ex 02: Normalizing Inline Transforms</option>
            <option value="ex-2">Ex 03: Rectangle Fill Color Blend</option>
            <option value="ex-3">Ex 04: SVG Z-Index DOM Reordering</option>
          </optgroup>
          <optgroup label="Tier 2: Timeline Orchestration">
            <option value="ex-4">Ex 05: Cascading Flow Chart reveal</option>
            <option value="ex-5">Ex 06: Harness Sub-modules Slide</option>
            <option value="ex-6">Ex 07: Drawing Connection Arrows</option>
            <option value="ex-7">Ex 08: Pulsing MotionPath Beads</option>
            <option value="ex-8">Ex 09: Text Character Reveals</option>
            <option value="ex-9">Ex 10: Infinite Heartbeat Pulsing</option>
          </optgroup>
          <optgroup label="Tier 3: Viewport & Focus Systems">
            <option value="ex-10">Ex 11: ScrollTrigger Viewport Pinning</option>
            <option value="ex-11">Ex 12: Camera Zoom (viewBox pan)</option>
            <option value="ex-12">Ex 13: Scrolling Info Disclosure</option>
            <option value="ex-13">Ex 14: Dim Unselected Overlays</option>
            <option value="ex-14">Ex 15: Scroll-drawn Connection sync</option>
            <option value="ex-15">Ex 16: Highlight Active nodes</option>
          </optgroup>
          <optgroup label="Tier 4: Interaction & Drag">
            <option value="ex-16">Ex 17: Interactive 3D hover card</option>
            <option value="ex-17">Ex 18: Draggable module sorting</option>
            <option value="ex-18">Ex 19: Dynamic Arrow Re-routing</option>
            <option value="ex-19">Ex 20: Vector Ripple Waves</option>
            <option value="ex-20">Ex 21: Draggable Snapping return</option>
          </optgroup>
          <optgroup label="Tier 5: Physics & Morphing">
            <option value="ex-21">Ex 22: Neon Glitch initializes</option>
            <option value="ex-22">Ex 23: Elastic Card Drop-In</option>
            <option value="ex-23">Ex 24: Collapsing/Expanding Drawer</option>
            <option value="ex-24">Ex 25: CustomEase Springy status</option>
            <option value="ex-25">Ex 26: Mouse tracking Parallax</option>
            <option value="ex-26">Ex 27: FLIP Layout Column Swap</option>
            <option value="ex-27">Ex 28: FLIP Harness resize</option>
            <option value="ex-28">Ex 29: Morphing rectangle corner radii</option>
            <option value="ex-29">Ex 30: System Reset cleaner</option>
          </optgroup>
        </select>
      </div>

      <div class="problem-description">
        <h2 id="prob-title">Challenge Title</h2>
        <p id="prob-desc">Problem details go here...</p>
        <div class="concepts-tags" id="prob-tags"></div>
      </div>

      <div class="editor-section">
        <div class="editor-header">
          <span class="editor-title">INTERACTIVE SCRIPT CONSOLE</span>
          <span class="editor-title" style="color: var(--success); cursor: pointer;" onclick="loadSolution()">[VIEW SOLUTION]</span>
        </div>
        <textarea id="console-editor" class="code-area" spellcheck="false"></textarea>
        <div class="btn-row">
          <button class="btn-secondary" onclick="resetCanvas()">RESET SVG</button>
          <button class="btn-primary" onclick="runScript()">RUN SCRIPT</button>
        </div>
      </div>
    </div>

    <div class="preview-pane">
      <span class="canvas-title">SVG Viewport Canvas</span>
      <div id="render-sandbox">
        <div class="grid-guide"></div>
        <div id="sandbox-content"></div>
      </div>
    </div>
  </div>

  <script>
    // Map Excalidraw's anonymous elements to clean DOM elements
    function prepareSvgForAnimation() {
      const groups = document.querySelectorAll("#sandbox-content g");
      groups.forEach(g => {
        const transform = g.getAttribute("transform") || "";
        if (transform.includes("translate(144.56")) {
          g.id = "card-title";
          g.classList.add("svg-card");
        } else if (transform.includes("translate(10 ")) {
          g.id = "card-text-gen";
          g.classList.add("svg-card");
        } else if (transform.includes("translate(319.97")) {
          g.id = "card-rag";
          g.classList.add("svg-card");
        } else if (transform.includes("translate(472.83")) {
          g.id = "card-harness";
          g.classList.add("svg-card");
        } else if (transform.includes("translate(484.18049458161704 377.65")) {
          g.id = "card-coding";
          g.classList.add("svg-sub-card");
        } else if (transform.includes("translate(484.18049458161704 443.33")) {
          g.id = "card-tool-calling";
          g.classList.add("svg-sub-card");
        } else if (transform.includes("translate(484.18049458161704 513.01")) {
          g.id = "card-scheduling";
          g.classList.add("svg-sub-card");
        }
      });

      // Connectors
      const connectorContainers = document.querySelectorAll("#sandbox-content g[stroke-linecap='round'] > g");
      connectorContainers.forEach(container => {
        const trans = container.getAttribute("transform") || "";
        if (trans.includes("translate(217.11")) container.classList.add("arrow", "arrow-title-to-text");
        else if (trans.includes("translate(308.99")) container.classList.add("arrow", "arrow-title-to-rag");
        else if (trans.includes("translate(430.47")) container.classList.add("arrow", "arrow-title-to-harness");
      });
    }

    // 30 Advanced Challenges Data
    const challenges = [
      {
        title: "Exercise 01: Programmatic Mapping Setup",
        desc: "Animate a simple opacity stagger on all verified cards (.svg-card, .svg-sub-card) to test that our programmatic mapping setup script runs and maps the anonymous elements correctly.",
        tags: ["setup", "opacity", "stagger"],
        starter: `gsap.to(".svg-card, .svg-sub-card", {\n  opacity: 0.2,\n  duration: 1,\n  stagger: 0.1,\n  yoyo: true,\n  repeat: 1\n});`,
        solution: `gsap.to(".svg-card, .svg-sub-card", {\n  opacity: 0.2,\n  duration: 1,\n  stagger: 0.1,\n  yoyo: true,\n  repeat: 1\n});`
      },
      {
        title: "Exercise 02: Normalizing Inline Transforms",
        desc: "Scale the #card-title panel up by 20% on hover. Verify that GSAP correctly targets and handles scales relative to the existing transform matrix coordinates without coordinate jumps.",
        tags: ["scale", "transformOrigin", "mouseenter"],
        starter: `// Write hover scales keeping transform origin in center\nconst card = document.getElementById("card-title");\ngsap.to(card, {\n  scale: 1.2,\n  transformOrigin: "50% 50%",\n  duration: 0.3,\n  repeat: 1,\n  yoyo: true\n});`,
        solution: `gsap.to("#card-title", {\n  scale: 1.2,\n  transformOrigin: "50% 50%",\n  duration: 0.3,\n  repeat: 1,\n  yoyo: true\n});`
      },
      {
        title: "Exercise 03: Rectangle Fill Color Blend",
        desc: "Blend the background fill of the Text Generation rectangle shape from its light green to dark forest green.",
        tags: ["fill", "rect selector", "color blend"],
        starter: `gsap.to("#card-text-gen rect", {\n  fill: "#2f5c3a",\n  duration: 1.5,\n  yoyo: true,\n  repeat: 1\n});`,
        solution: `gsap.to("#card-text-gen rect", {\n  fill: "#2f5c3a",\n  duration: 1.5,\n  yoyo: true,\n  repeat: 1\n});`
      },
      {
        title: "Exercise 04: SVG Z-Index DOM Reordering",
        desc: "SVGs do not support CSS z-index rules. Move the #card-harness element to the end of its parent container dynamically to ensure its rendering borders sit on top of connecting arrow overlays.",
        tags: ["DOM reordering", "z-index rendering", "append"],
        starter: `const harness = document.getElementById("card-harness");\n// Append card-harness to parent container to place it at top-layer depth`,
        solution: `const harness = document.getElementById("card-harness");\nharness.parentNode.appendChild(harness);\ngsap.from(harness, { opacity: 0, duration: 0.3 });`
      },
      {
        title: "Exercise 05: Cascading Flow Chart Reveal",
        desc: "Hide all components and reveal them sequentially: Title card first, then connector arrows, then child modules.",
        tags: ["timeline", "reveals", "stagger", "overlaps"],
        starter: `gsap.set(".svg-card, .svg-sub-card, .arrow", { opacity: 0 });\nconst tl = gsap.timeline();\n// Construct the flow reveal sequence`,
        solution: `gsap.set(".svg-card, .svg-sub-card, .arrow", { opacity: 0 });\nconst tl = gsap.timeline();\ntl.to("#card-title", { opacity: 1, duration: 0.6 })\n  .to(".arrow", { opacity: 1, duration: 0.4, stagger: 0.15 }, "-=0.2")\n  .to([ "#card-text-gen", "#card-rag", "#card-harness" ], { opacity: 1, duration: 0.6, stagger: 0.15 }, "-=0.3");`
      },
      {
        title: "Exercise 06: Harness Sub-modules Slide",
        desc: "Reveal sub-cards inside the Agent Harness by sliding them vertically into their final slots while fading opacity.",
        tags: ["y-translation", "slide-in", "stagger"],
        template: "",
        starter: `gsap.set(["#card-coding", "#card-tool-calling", "#card-scheduling"], { opacity: 0, y: 30 });\n// Slide cards up sequentially`,
        solution: `gsap.to(["#card-coding", "#card-tool-calling", "#card-scheduling"], {\n  opacity: 1,\n  y: 0,\n  duration: 0.8,\n  stagger: 0.15,\n  ease: "back.out(1.7)"\n});`
      },
      {
        title: "Exercise 07: Drawing Connection Arrows",
        desc: "Extract vector path lengths from all connecting arrow tags, offset them, and draw them on in unison.",
        tags: ["getTotalLength", "strokeDashoffset", "stagger line draw"],
        starter: `// Write strokeDashoffset draws across all arrow paths`,
        solution: `const paths = document.querySelectorAll(".arrow path");\npaths.forEach(p => {\n  const len = p.getTotalLength();\n  gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });\n  gsap.to(p, { strokeDashoffset: 0, duration: 1.5, ease: "power2.out" });\n});`
      },
      {
        title: "Exercise 08: Pulsing MotionPath Beads",
        desc: "Dynamically append a circular indicator bead and animate it infinitely along the Title-to-Harness arrow connection.",
        tags: ["MotionPathPlugin", "bead emitter", "infinite cycle"],
        starter: `// Inject circle, align with arrow-title-to-harness path, and slide`,
        solution: `const svg = document.querySelector("#sandbox-content svg");\nconst bead = document.createElementNS("http://www.w3.org/2000/svg", "circle");\nbead.setAttribute("r", "6");\nbead.setAttribute("fill", "#ea580c");\nsvg.appendChild(bead);\n\ngsap.to(bead, {\n  duration: 3,\n  repeat: -1,\n  ease: "none",\n  motionPath: {\n    path: ".arrow-title-to-harness path",\n    align: ".arrow-title-to-harness path",\n    alignOrigin: [0.5, 0.5]\n  }\n});`
      },
      {
        title: "Exercise 09: Text Character Reveals",
        desc: "Stagger character reveals on all text nodes inside cards using the TextPlugin.",
        tags: ["TextPlugin", "word typewriter", "stagger text"],
        starter: `// Animate card text characters sequentially`,
        solution: `const texts = document.querySelectorAll(".svg-card text");\ntexts.forEach(t => {\n  const orig = t.textContent;\n  gsap.set(t, { text: "" });\n  gsap.to(t, { text: orig, duration: 1.5, ease: "none" });\n});`
      },
      {
        title: "Exercise 10: Infinite Heartbeat Pulsing",
        desc: "Set up status heartbeat pulses on elements using infinite yoyo opacity scaling.",
        tags: ["opacity", "repeat: -1", "yoyo", "pulse indicator"],
        starter: `// Make sub-cards pulse gently`,
        solution: `gsap.to(".svg-sub-card rect", {\n  opacity: 0.5,\n  duration: 0.6,\n  repeat: -1,\n  yoyo: true,\n  ease: "sine.inOut",\n  stagger: 0.15\n});`
      },
      {
        title: "Exercise 11: ScrollTrigger Viewport Pinning",
        desc: "Lock scroll boundaries to center and inspect cards.",
        tags: ["ScrollTrigger", "pin", "scrolling timeline"],
        starter: `// Pin the canvas wrapper`,
        solution: `ScrollTrigger.create({\n  trigger: "#render-sandbox",\n  start: "top center",\n  end: "+=300",\n  pin: true\n});`
      },
      {
        title: "Exercise 12: Camera Zoom (viewBox pan)",
        desc: "Interpolate parent viewBox coordinates to focus camera frames on the Harness block.",
        tags: ["viewBox animation", "zoom", "camera pan"],
        starter: `// Shift viewBox to center on Harness node coordinates`,
        solution: `gsap.to("#sandbox-content svg", {\n  attr: { viewBox: "450 220 280 340" },\n  duration: 2.0,\n  ease: "power2.inOut"\n});`
      },
      {
        title: "Exercise 13: Scrolling Info Disclosure",
        desc: "Reveal DOM card panels synchronously when elements align inside scroll targets.",
        tags: ["ScrollTrigger", "content disclosure"],
        starter: `// Build ScrollTrigger triggers`,
        solution: `gsap.to("#card-rag", { scale: 1.05, transformOrigin: "50% 50%", duration: 0.5, repeat: 1, yoyo: true });`
      },
      {
        title: "Exercise 14: Dim Unselected Overlays",
        desc: "Dim surrounding elements and scale up the clicked node on mouse clicks.",
        tags: ["click overlays", "opacity dim", "interactive scale"],
        starter: `// Scale clicked node; dim others`,
        solution: `document.querySelectorAll(".svg-card").forEach(c => {\n  c.addEventListener("click", () => {\n    gsap.to(".svg-card, .svg-sub-card", { opacity: 0.2, scale: 0.95, transformOrigin: "50% 50%" });\n    gsap.to(c, { opacity: 1, scale: 1.1, transformOrigin: "50% 50%" });\n  });\n});`
      },
      {
        title: "Exercise 15: Scroll-drawn Connection sync",
        desc: "Tie line drawing progression to viewport scrolls.",
        tags: ["ScrollTrigger", "strokeDashoffset", "scrub scroll"],
        starter: `// Sync offsets to scroll trigger`,
        solution: `const paths = document.querySelectorAll(".arrow path");\npaths.forEach(p => {\n  const len = p.getTotalLength();\n  gsap.set(p, { strokeDasharray: len, strokeDashoffset: len });\n  gsap.to(p, {\n    strokeDashoffset: 0,\n    scrollTrigger: {\n      trigger: "#render-sandbox",\n      start: "top center",\n      end: "bottom center",\n      scrub: true\n    }\n  });\n});`
      },
      {
        title: "Exercise 16: Highlight Active nodes",
        desc: "Sequence highlight indicators to sweep across nodes.",
        tags: ["class toggle", "timeline scan"],
        starter: `// Cycle card flashes`,
        solution: `const tl = gsap.timeline({ repeat: -1 });\ntl.to(".svg-card", { scale: 1.05, transformOrigin: "50% 50%", duration: 0.3, stagger: 0.2, yoyo: true, repeat: 1 });`
      },
      {
        title: "Exercise 17: Interactive 3D hover card",
        desc: "Tilt cards in 3D using mouse coordinate offsets.",
        tags: ["3D transforms", "rotationX", "rotationY", "parallax card"],
        starter: `const card = document.getElementById("card-title");\n// Setup rotationX and rotationY coordinates relative to mouse offsets`,
        solution: `const card = document.getElementById("card-title");\ngsap.set(card, { transformPerspective: 1000 });\ncard.addEventListener("mousemove", (e) => {\n  const r = card.getBoundingClientRect();\n  const x = e.clientX - r.left - r.width/2;\n  const y = e.clientY - r.top - r.height/2;\n  gsap.to(card, { rotationY: x * 0.1, rotationX: -y * 0.1, duration: 0.2 });\n});`
      },
      {
        title: "Exercise 18: Draggable module sorting",
        desc: "Rearrange sub-cards vertically inside the Harness boundaries.",
        tags: ["Draggable", "type: y", "vertical re-ordering"],
        starter: `// Make subcards draggable along Y axis`,
        solution: `gsap.registerPlugin(Draggable);\nDraggable.create(".svg-sub-card", {\n  type: "y",\n  bounds: "#card-harness rect"\n});`
      },
      {
        title: "Exercise 19: Dynamic Arrow Re-routing",
        desc: "Dynamically re-calculate connection path string segments when cards are panned.",

    function initSandbox() {
      document.getElementById("sandbox-content").innerHTML = SVG_MARKUP;
      prepareSvgForAnimation();
      loadChallenge("ex-0");
    }

    initSandbox();

    function loadChallenge(id) {
      const index = parseInt(id.replace("ex-", ""));
      activeChallengeIndex = index;
      
      const ch = challenges[index];
      
      document.getElementById("prob-title").textContent = ch.title;
      document.getElementById("prob-desc").textContent = ch.desc;
      
      const tagsContainer = document.getElementById("prob-tags");
      tagsContainer.innerHTML = "";
      ch.tags.forEach(t => {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsContainer.appendChild(span);
      });
      
      editor.value = ch.starter;
      
      // Reset animations
      gsap.killTweensOf("*");
      gsap.set(".svg-card, .svg-sub-card, rect, text, path", { clearProps: "all" });
      const svg = document.querySelector("#sandbox-content svg");
      if (svg) svg.setAttribute("viewBox", "0 0 726.64 605.88");
    }

    function loadSolution() {
      const ch = challenges[activeChallengeIndex];
      editor.value = ch.solution;
    }

    function resetCanvas() {
      gsap.killTweensOf("*");
      gsap.set(".svg-card, .svg-sub-card, rect, text, path", { clearProps: "all" });
      const svg = document.querySelector("#sandbox-content svg");
      if (svg) svg.setAttribute("viewBox", "0 0 726.64 605.88");
      
      const ch = challenges[activeChallengeIndex];
      editor.value = ch.starter;
    }

    function runScript() {
      try {
        gsap.killTweensOf("#sandbox-content *");
        const code = editor.value;
        const executeCode = new Function(code);
        executeCode();
      } catch (err) {
        alert("Execution Error: " + err.message);
      }
    }
  </script>
